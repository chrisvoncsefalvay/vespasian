name: Checks

on:
  push:
    branches-ignore:
      - zerogpu-space
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python_arch: x64
            binary: target/x86_64-unknown-linux-gnu/debug/vespasian
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python_arch: arm64
            binary: target/aarch64-unknown-linux-gnu/debug/vespasian
          - os: macos-15
            target: aarch64-apple-darwin
            python_arch: arm64
            binary: target/aarch64-apple-darwin/debug/vespasian
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            python_arch: x64
            binary: target/x86_64-pc-windows-msvc/debug/vespasian.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: x64
            binary: target/aarch64-pc-windows-msvc/debug/vespasian.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: python/requirements.txt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
        env:
          VESPASIAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Install the CPU model runtime
        run: |
          python -m pip install 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r python/requirements.txt
      - name: Verify Qwen processor dependencies
        run: python -c "from transformers import Qwen3VLVideoProcessor; Qwen3VLVideoProcessor()"
      - run: python -m unittest discover -s python -p 'test_*.py'
      - run: cargo build --locked --target ${{ matrix.target }}
      - name: Exercise runtime setup and commands
        run: python scripts/release_smoke.py --binary "${{ matrix.binary }}" --python "${{ steps.python.outputs.python-path }}"

  package:
    name: Crate and release tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.91.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python -m unittest discover -s scripts -p '*_test.py'
      - run: cargo package --locked
