[package]
name = "vespasian"
version = "0.3.1"
edition = "2021"
rust-version = "1.91"
description = "Weight space editing for small language models with frontier-guided tensor edits and measured hill climbs"
license = "Apache-2.0"
repository = "https://github.com/chrisvoncsefalvay/vespasian"
homepage = "https://chrisvoncsefalvay.com/vespasian/"
documentation = "https://github.com/chrisvoncsefalvay/vespasian#readme"
readme = "README.md"
keywords = ["weight-space", "model-editing", "weight-editing", "llm", "tui"]
categories = ["command-line-utilities", "science"]
include = ["/src/**", "/python/*.py", "/python/fixtures/**", "/python/requirements.txt", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/examples/**", "/scripts/generate_starters.py"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
